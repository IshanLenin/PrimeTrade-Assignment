<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PrimeTrade Task Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans min-h-screen pb-10">

    <div id="messageBanner"
        class="hidden fixed top-4 right-4 p-4 rounded shadow-lg max-w-md z-50 transition-all duration-300"></div>

    <div class="max-w-4xl mx-auto pt-10 px-4">
        <h1 class="text-3xl font-bold text-gray-800 text-center mb-8">PrimeTrade Task Management</h1>


        <div id="authSection" class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Register Account</h2>
                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Email</label>
                        <input type="email" id="regEmail" required
                            class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-200 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Password</label>
                        <input type="password" id="regPassword" required
                            class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-200 outline-none">
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">Sign
                        Up</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Log In</h2>
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Email</label>
                        <input type="email" id="loginEmail" required
                            class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-200 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Password</label>
                        <input type="password" id="loginPassword" required
                            class="w-full mt-1 p-2 border rounded focus:ring focus:ring-blue-200 outline-none">
                    </div>
                    <button type="submit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded transition">Sign
                        In</button>
                </form>
            </div>
        </div>

        <div id="dashboardSection" class="hidden space-y-8">
            <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow">
                <div>
                    <span class="text-sm text-gray-500">Logged in as:</span>
                    <span id="userDisplay" class="font-semibold text-gray-700 ml-1"></span>
                </div>
                <button id="logoutBtn"
                    class="bg-red-500 hover:bg-red-600 text-white px-4 py-1.5 rounded font-medium text-sm transition">Log
                    Out</button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Assign New Task (Admin Only)</h2>
                <form id="taskForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Task Title</label>
                            <input type="text" id="taskTitle" required
                                class="w-full mt-1 p-2 border rounded outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Assign to User ID</label>
                            <input type="number" id="taskOwnerId" required
                                class="w-full mt-1 p-2 border rounded outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Description</label>
                        <textarea id="taskDesc" rows="2" required
                            class="w-full mt-1 p-2 border rounded outline-none"></textarea>
                    </div>
                    <button type="submit"
                        class="bg-purple-600 hover:bg-purple-700 text-white font-medium px-6 py-2 rounded transition">Create
                        Task</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Active Tasks</h2>
                <div id="taskList" class="space-y-4 text-gray-500 text-center py-4">
                    No tasks found. Create one above or check user assignments.
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let token = "";

        function showNotification(message, isSuccess = true) {
            const banner = document.getElementById("messageBanner");
            banner.innerText = message;
            banner.className = isSuccess
                ? "fixed top-4 right-4 p-4 rounded shadow-lg max-w-md z-50 text-white bg-green-600"
                : "fixed top-4 right-4 p-4 rounded shadow-lg max-w-md z-50 text-white bg-red-600";
            banner.classList.remove("hidden");
            setTimeout(() => banner.classList.add("hidden"), 4000);
        }

        // ── AUTH ──────────────────────────────────────────────────────────────────────

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showNotification("Registration successful! You can now log in.", true);
                    document.getElementById("registerForm").reset();
                } else {
                    showNotification(data.detail ? JSON.stringify(data.detail) : "Registration failed.", false);
                }
            } catch {
                showNotification("Could not connect to the backend server.", false);
            }
        });

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const formData = new URLSearchParams();
                formData.append("username", email);
                formData.append("password", password);

                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    token = data.access_token;
                    showNotification("Login successful! Welcome to your dashboard.", true);
                    document.getElementById("userDisplay").innerText = email;
                    document.getElementById("authSection").classList.add("hidden");
                    document.getElementById("dashboardSection").classList.remove("hidden");
                    document.getElementById("loginForm").reset();
                    fetchTasks();
                } else {
                    showNotification(data.detail || "Invalid email or password.", false);
                }
            } catch {
                showNotification("Could not connect to the backend server.", false);
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", () => {
            token = "";
            document.getElementById("authSection").classList.remove("hidden");
            document.getElementById("dashboardSection").classList.add("hidden");
            showNotification("Logged out successfully.", true);
        });

        // ── TASK CRUD ─────────────────────────────────────────────────────────────────

        // GET — fetch and render all tasks
        async function fetchTasks() {
            const taskListContainer = document.getElementById("taskList");
            taskListContainer.innerHTML = "<div class='text-gray-600 text-center py-4'>Loading tasks...</div>";

            try {
                const response = await fetch(`${API_URL}/tasks`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await response.json();

                if (response.ok && data.length > 0) {
                    taskListContainer.innerHTML = "";
                    data.forEach(task => {
                        const taskCard = document.createElement("div");
                        taskCard.className = "border p-4 rounded bg-gray-50 text-gray-700 flex justify-between items-start";
                        taskCard.innerHTML = `
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800 text-lg">${task.title}</h4>
                        <p class="text-sm text-gray-600 mt-1">${task.description}</p>
                    </div>
                    <div class="flex items-center gap-2 ml-4">
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">ID: ${task.id}</span>
                        <button onclick="patchTask(${task.id}, '${task.title}', '${task.description}')"
                            class="text-xs bg-yellow-100 text-yellow-800 hover:bg-yellow-200 px-2 py-1 rounded transition">
                            Edit
                        </button>
                        <button onclick="deleteTask(${task.id})"
                            class="text-xs bg-red-100 text-red-800 hover:bg-red-200 px-2 py-1 rounded transition">
                            Delete
                        </button>
                    </div>
                `;
                        taskListContainer.appendChild(taskCard);
                    });
                } else {
                    taskListContainer.innerHTML = "<div class='text-gray-500 text-center py-4'>No tasks assigned yet.</div>";
                }
            } catch (error) {
                taskListContainer.innerHTML = "<div class='text-red-500 text-center py-4'>Failed to fetch tasks.</div>";
                console.error(error);
            }
        }

        // DELETE — remove a single task by ID
        async function deleteTask(taskId) {
            if (!confirm(`Are you sure you want to delete task #${taskId}?`)) return;

            try {
                const response = await fetch(`${API_URL}/tasks/${taskId}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    showNotification("Task deleted successfully.", true);
                    fetchTasks(); // Refresh the list
                } else {
                    const data = await response.json();
                    showNotification(data.detail || "Failed to delete task.", false);
                }
            } catch {
                showNotification("Could not connect to the backend server.", false);
            }
        }

        // PATCH — update a single task's title and/or description by ID
        async function patchTask(taskId, currentTitle, currentDescription) {
            const newTitle = prompt("Edit task title:", currentTitle);
            if (newTitle === null) return; // User cancelled

            const newDescription = prompt("Edit task description:", currentDescription);
            if (newDescription === null) return; // User cancelled

            try {
                const response = await fetch(`${API_URL}/tasks/${taskId}`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ title: newTitle, description: newDescription })
                });

                if (response.ok) {
                    showNotification("Task updated successfully.", true);
                    fetchTasks(); // Refresh the list
                } else {
                    const data = await response.json();
                    showNotification(data.detail || "Failed to update task.", false);
                }
            } catch {
                showNotification("Could not connect to the backend server.", false);
            }
        }

        // POST — create a new task
        document.getElementById("taskForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("taskTitle").value;
            const desc = document.getElementById("taskDesc").value;
            const ownerId = document.getElementById("taskOwnerId").value;

            if (!title || !desc || !ownerId) {
                showNotification("Please fill in all task fields.", false);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/tasks`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, description: desc, owner_id: parseInt(ownerId) })
                });
                const data = await response.json();

                if (response.ok) {
                    showNotification("Task assigned successfully!", true);
                    document.getElementById("taskForm").reset();
                    fetchTasks();
                } else {
                    showNotification(data.detail || "Failed to create task.", false);
                }
            } catch {
                showNotification("Could not connect to the backend server.", false);
            }
        });
    </script>

</body>

</html>
